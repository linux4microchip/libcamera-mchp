%YAML 1.1
---
# Microchip ISC specific vendor controls
vendor: microchip
controls:
  - RedGain:
      type: int32_t
      direction: inout
      description: Red Gain Component
      min: 0
      max: 8191
      default: 512

  - BlueGain:
      type: int32_t
      direction: inout
      description: Blue Gain Component
      min: 0
      max: 8191
      default: 512

  - GreenRedGain:
      type: int32_t
      direction: inout
      description: Green-Red Gain Component
      min: 0
      max: 8191
      default: 512

  - GreenBlueGain:
      type: int32_t
      direction: inout
      description: Green-Blue Gain Component
      min: 0
      max: 8191
      default: 512

  - RedOffset:
      type: int32_t
      direction: inout
      description: Red Offset Component
      min: -4095
      max: 4095
      default: 0

  - BlueOffset:
      type: int32_t
      direction: inout
      description: Blue Offset Component
      min: -4095
      max: 4095
      default: 0

  - GreenRedOffset:
      type: int32_t
      direction: inout
      description: Green-Red Offset Component
      min: -4095
      max: 4095
      default: 0

  - GreenBlueOffset:
      type: int32_t
      direction: inout
      description: Green-Blue Offset Component
      min: -4095
      max: 4095
      default: 0

  - Hue:
      type: int32_t
      direction: inout
      description: |
        Hue rotation in degrees. Only effective on SAMA7G5 with CBHS
        hardware (has_cbhs = true in the tuning file). Applied via
        V4L2_CID_HUE in the ISC CBHS block after gamma.

        0 means no hue shift (neutral). Positive values rotate hue
        clockwise on the colour wheel; negative values rotate
        counter-clockwise.
      min: -180
      max: 180
      default: 0

  - IscStillProcess:
      type: bool
      direction: inout
      description: |
        Request the software still post-processing pass (lens-shading)
        for this frame. The single-core SAMA7G5 Cortex-A7 cannot sustain
        the full-frame pass at the video rate, so it is a per-request
        capture-intent flag rather than an always-on stage: set it true
        on the frame to keep and leave it unset (or false) on preview
        frames.

        The pipeline echoes it back in result metadata as true only if
        the pass actually ran on that frame, and false if the buffer
        could not be mapped or filtered, so the application can confirm
        the saved frame was processed.
      default: false

  - IscHistogramMeans:
      type: float
      direction: out
      size: [4]
      description: |
        ISC pre-WB histogram channel means for the current frame, in
        pedestal-subtracted net histogram bins (0–511 scale).

        Emitted by the IPA on every processed frame. Array order matches
        the ISC hardware histogram channel indices:
          [0] = GR (green-red Bayer channel)
          [1] = R  (red Bayer channel)
          [2] = GB (green-blue Bayer channel)
          [3] = B  (blue Bayer channel)

        The ISC histogram tap point (ISC_HIS_CFG_RAR) is before the WB
        block in the hardware pipeline, so these means are unaffected by
        the IPA white balance gains. They represent the raw scene
        illuminant chromaticity and are the primary input for AWB and
        CCM calibration.

        Used by the microchip_isc.py calibration tool to compute
        per-illuminant channel ratios without requiring a pre-WB pixel
        DMA output (which the ISC hardware does not provide).

  - IscHistogramBins:
      type: int32_t
      direction: out
      size: [2048]
      description: |
        ISC pre-WB histogram bin counts for the current frame.

        Full 512-bin histogram for all 4 Bayer channels, flattened in
        channel-major order: [GR[0..511], R[0..511], GB[0..511], B[0..511]].
        Total 2048 int32 values.

        Emitted every frame alongside IscHistogramMeans.

        Bin index i corresponds to pixel value range [2i, 2i+1] in 10-bit
        sensor units (bin = pixel >> 1). The ISC histogram tap is pre-WB so
        values are unaffected by IPA white balance gains.

        Used by microchip_isc.py to compute full spectral statistics
        (P10-P90 trimmed means, spread, CDF) for CCM and AWB calibration
        without requiring a RAW DMA output path.
...
