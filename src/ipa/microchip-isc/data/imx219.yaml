---
version: 1
# Algorithm configurations
# Hardware capabilities (hasDpc, hasBipartiteGamma, hasCbhs, statsAvailable)
# are detected at runtime by the pipeline handler and passed to the IPA via
# IPAConfigInfo::hwCaps. They must not be duplicated here.
algorithms:
  - BlackLevelCorrection:
      # Sensor black pedestal in 10-bit units. Subtracted via WB offsets on
      # SAMA5D2 (hasDpc=false); on SAMA7G5 DPC hardware handles it instead.
      # Per-channel values fall back to black_level when absent.
      black_level: 64
      black_level_r: 64
      black_level_gr: 64
      black_level_gb: 64
      black_level_b: 64
  - Awb:
      convergence:
        # Tracking speed [0-1]: fraction of gain error corrected per update.
        # Used after startup_frames to give smooth temporal tracking.
        speed: 0.3
        # Startup speed [0-1]: fast convergence for the first startup_frames
        # updates, giving instant convergence during sensor warmup so gains
        # reach steady state before the lock check.
        startup_speed: 1.0
        # Number of frames to use startup_speed before switching to speed.
        startup_frames: 10
        damping: 0.85
        stability_threshold: 0.015
        frames: 3
        # Minimum scene luminance (histogram units 0-511) below which AWB
        # updates are suppressed. Near-dark scenes produce unreliable
        # channel means due to ISC 8-bit histogram quantization.
        min_scene_luminance: 2

      color_temperature:
        min: 1800
        max: 15000

      # Per-channel gain clamp limits for the grey-world AWB engine.
      # r_b_min/max bound R and B gains; gb_min/max bound the GR/GB
      # green-balance ratio. Tighten for more stable but slower adaptation.
      gain_limits:
        # R/B gains clamp to [r_b_min, r_b_max]. Warm illuminants need
        # rGain below unity, so keep the floor under 1.0.
        r_b_min: 0.2
        r_b_max: 8.0
        gb_min: 0.9
        gb_max: 1.1

      # Pre-WB channel mean (0-511) at/below which grey-world is distrusted and
      # the CT table anchor takes over for that channel, suppressing the
      # low-signal AE/AWB runaway. band = confidence-ramp width in bins.
      # max_deviation bounds grey-world to [anchor/d, anchor*d] so a starved
      # channel cannot rail the target and limit-cycle the gain.
      noise_floor:
        bins: 8
        band: 10
        max_deviation: 1.9

      # Fraction of highlight-based illuminant estimate blended into grey-world.
      # Top-20% pixels better approximate the illuminant than the scene mean.
      # 0.0 = pure grey-world; 0.3 balances accuracy with stability.
      highlight_weight: 0.3

      # Fallback colour temperature used when no prior CT estimate exists.
      # 5500 K covers outdoor daylight and typical indoor LED.
      ct_fallback: 5500

      # Per-CT reference WB gains, interpolated in MRD space from the AWB CT
      # estimate so the first frame is near-correct for any illuminant. rGain
      # rises and bGain falls with CT: warm light is red-rich (attenuate red,
      # boost blue); cool light is blue-rich (the reverse). Anchored to a
      # neutral-grey capture at ~6500 K (R=1.10, B=1.05); other CTs follow the
      # trend and want per-CT grey-card calibration.
      reference_gains_table:
        - { ct: 2500, r: 0.533, b: 2.472 }  # Candlelight / deep tungsten
        - { ct: 3000, r: 0.628, b: 2.070 }  # Tungsten lamp
        - { ct: 3500, r: 0.695, b: 1.782 }  # Halogen / warm LED
        - { ct: 4000, r: 0.746, b: 1.567 }  # Cool fluorescent / neutral LED
        - { ct: 4500, r: 0.793, b: 1.401 }  # Midday window light
        - { ct: 5500, r: 0.978, b: 1.190 }  # Daylight / noon sun
        - { ct: 6500, r: 1.105, b: 1.044 }  # D65 / overcast
        - { ct: 7500, r: 1.199, b: 0.937 }  # Heavily overcast / open shade
        - { ct: 9000, r: 1.301, b: 0.821 }  # Blue sky / deep shade

      # Scalar fallback used only when reference_gains_table is absent.
      reference_gains:
        r: 2.55
        b: 2.10
        gr: 1.0
        gb: 1.02

      # Sensor-to-XYZ colour matrix for Robertson (1968) CCT estimation.
      # Approximate values for IMX219 derived from published spectral responsivity.
      # Row-major: row 0 = X, row 1 = Y, row 2 = Z. All rows should sum ~1.0.
      # Calibrate with a Macbeth ColorChecker under known illuminants for ±200 K accuracy.
      ct_color_matrix: [0.4900, 0.3100, 0.1200, 0.2200, 0.6600, 0.0700, 0.0200, 0.1000, 0.8700]

  - Agc:
      # Calibrated 2026-04-25: SAMA7G5EK + IMX219 NoIR, 2370 lux, 4500K lightbox
      # Spyder Checkr 24 grey ramp side filling frame, gain=1.0, exposure=16433us
      # Calibrated 2026-04-25: SAMA7G5EK + IMX219 NoIR, 2370 lux, 4500K.
      # 18% grey card → L=117/255. WB factor=1.1481, net_18pct=60 bins.
      # WB-normalised target = 60 × 1.1481 = 68.9 → 69
      target_brightness: 69
      # Linear mid-grey target (net histogram bins) for raw Bayer output.
      # Raw frames bypass gamma/tone/WB, so metering to target_brightness
      # leaves them near-black. ~0.18 × 511 puts 18% grey at mid-scale.
      raw_target_brightness: 90
      # Calibrated 2026-04-25: gain=1.0 at 2370 lux, exposure=16433us
      lux_reference:
        reference_Y: 60.50
        reference_exposure_us: 16433.0
        reference_gain: 1.0
        reference_lux: 2370.0
      # y_target: lux → WB-normalised bins target. Anchor=69/511=0.1351.
      # Fixed gamma owns tone now (AutoLevels/CBC/adaptive-gamma off), so the
      # old steep lux rolloff — which metered dim to leave room for downstream
      # lift — underexposes and lifts noise. Hold the 18%-grey anchor across
      # the working range; only deep-dark scenes drop toward the noise floor.
      y_target: [2370, 0.1351, 1000, 0.1351, 615, 0.1300, 300, 0.1200, 148, 0.1000, 50, 0.0700, 10, 0.0300, 1, 0.0120]
      # IIR smoothing for lux estimate: smoothed = alpha*raw + (1-alpha)*prev
      # 0.3 = default (3-4 frame settling). 1.0 = no smoothing.
      lux_smoothing_alpha: 0.30
      # Fraction of clipped pixels that triggers highlight anti-windup.
      # When clipping exceeds this threshold the AGC is prevented from
      # increasing exposure, guarding against oscillation in outdoor
      # high-contrast scenes where shadows lower the luminance mean
      # while highlights are already saturated.
      clip_threshold: 0.02
      # Minimum luminance (histogram units 0-511) for AE stability check.
      # Below this floor the loop is treated as unstable regardless of error.
      ae_luminance_floor: 3.0
      # P85 highlight-protection metering (mobile-style AE).
      # Detects over-bright scenes (flat histogram) and reduces exposure
      # so P85 of the luminance histogram stays at or below the threshold.
      # This creates headroom for dynamic range expansion.
      # Expected: P90-P10 range improves from 40 -> 100-130.
      #   threshold: 0.55 = 55% of 511 bins (~bin 281, L=170/255 post-gamma)
      #   strength:  1.0  = full correction
      highlight_p85_threshold: 0.35
      # Off: IQM zone metering is the single highlight authority. P85 stacked
      # multiplicatively on top of it and the hist-max guard, over-suppressing
      # the target (was 0.5).
      highlight_p85_strength: 0.0
      # Global operator EV lever, applied once on top of the lux target.
      # 0 = neutral; one lens for overall exposure without touching the biases.
      ev_default: 0.0
      # Zone metering: highlight-avoidance weight strength [0-1].
      # 0=uniform mean (traditional), 1=full highlight de-emphasis (mobile).
      # 0.7 gives natural indoor exposure matching mobile highlight AE.
      zone_metering_strength: 0.50
      # Inter-quantile mean AE metering range [qLo, qHi].
      # Ignores the darkest qLo fraction and brightest (1-qHi) fraction.
      # 0.02/0.98 = exclude worst 2% shadows and 2% highlights.
      ae_iqm_q_lo: 0.02
      ae_iqm_q_hi: 0.98
      # Off: redundant with IQM zone metering, which already folds in the
      # top-quantile constraint. Avoids a second multiplicative pull-down.
      ae_highlight_q_hi: 0.0
      ae_highlight_target: 0.70
      # Scene entropy-based automatic EV bias.
      # When entropy < threshold AND luminance > 1.5x target,
      # the scene is flat/bright. Apply scene_ev_bias stops.
      scene_ev_threshold: 1.0  # always use P10 check only
      # No global under-exposure: the fixed gamma LUT has its own highlight
      # rolloff, so metering a true 18% grey needs no extra headroom bias.
      # P85/IQM highlight guards still pull bright scenes down on demand.
      scene_ev_bias: 0.0
      # P10 of pre-gamma luminance above this = no shadow detail.
      # Calibrated 2026-04-26: bright white-wall indoor scene has P10=24 net bins.
      # Threshold=10 fires on any scene where the shadow floor is above 10 bins
      # (i.e. no true dark areas — globally bright/flat scene). Stays silent for
      # dim scenes where P10 = 0-5 bins. This is the Jensen gap compensation:
      # global histogram mean underestimates JPEG L by 2.5× for flat scenes
      # because mean(gamma(x)) >> gamma(mean(x)). EV-1.5 pushes pixels out of
      # the steep bipartite toe, reducing the Jensen gap.
      scene_bright_p10: 10.0

      # Mains flicker avoidance: set to 50 or 60 to round shutter to the
      # nearest multiple of the mains half-period. 0 = disabled (outdoor/DC).
      flicker_hz: 0

      # Slowest auto frame rate (fps). In low light the AGC extends the frame
      # (raising the exposure ceiling) to prefer a longer, lower-noise shutter
      # over analogue gain, down to this floor; gain covers anything below it.
      # An app FrameDurationLimits pin caps the extension. 0 = disabled.
      min_frame_rate: 10

      convergence:
        speed: 0.3
        stability_threshold: 10.0
        frames: 3

      # Exposure ratio clamp limits and highlight anti-windup cap.
      # ratioMin/Max limit the per-frame step to prevent large oscillations.
      # clip_cap is applied when clipping fraction > clip_threshold.
      ratio_clamp:
        min: 0.25
        # 2.5× per-frame limit prevents large luminance steps on scene cuts
        # that otherwise drive AGC into multi-frame oscillation. 4.0 was too
        # aggressive: a single dark-to-bright cut could apply 4× gain in one
        # step, overshooting and triggering a hunt cycle.
        max: 2.5
        clip_cap: 0.85

      # Gain update thresholds relative to the current exposure ratio.
      # Gain is boosted when exposure is maxed and ratio > boost; it is
      # pushed toward minimum when ratio < reduction.
      gain_thresholds:
        boost: 1.05
        reduction: 0.95

  - Cbc:
      # Contrast enhancement strength (0=none, 1=full histogram stretch).
      # DISABLED (0.0): the CBHS block is NOT in the RGB565 ISC pipeline
      # (pipeline bits = CFA|WB|GAM|CC, no CBHS). The contrast feedback
      # (cbcGain) still reaches the AGC and artificially divides effectiveTarget
      # by ~1.4, causing phantom underexposure. Set to 0.0 to prevent this.
      # Re-enable for YUYV/YUV output formats where CBHS IS active.
      contrast_strength: 0.0
      # P5-to-P95 spread target as a fraction of the histogram range.
      # 0.45 is conservative — avoids over-stretching flat indoor scenes
      # while still giving a noticeable contrast lift on grey/overcast shots.
      target_spread: 0.50
      # Temporal smoothing [0-1]. Higher values reduce flickering.
      # 0.65 is the minimum needed to prevent CBC brightness register flicker
      # when AGC and CBC both react to the same scene changes on successive
      # frames. At 0.25 the register could change by ~75% of the error each
      # frame, producing visible brightness oscillation under mixed lighting.
      smoothing_factor: 0.65
      # Default saturation (0-100, 16=unity on SAMA7G5 CBHS).
      # Keep neutral here so RGB and YUV paths start from a known-good baseline.
      saturation: 16
      # Default hue rotation in degrees (-180 to +180). 0 = no rotation.
      # Applied via V4L2_CID_HUE on SAMA7G5 (has_cbhs=true).
      hue: 0
      # Maximum contrast gain from histogram stretch (1.0=no stretch, 3.0=3x max).
      contrast_max_gain: 3.0
      # Suppress CBC contrast stretch in very dark scenes. When AGC is at
      # max gain, CBC stretch causes double-amplification → clipping.
      # 0.01 normalised ≈ 5 pre-WB histogram bins.
      dark_scene_min_luminance: 0.01

  - Gamma:
      # Base gamma exponent for the power-law tone curve.
      # 2.2 approximates sRGB encoding; lower values brighten midtones.
      gamma: 2.2
      # Adaptive strength [0.0-1.0]. 0 = purely parametric, 1 = fully adaptive.
      # Disabled pending y_target recalibration against actual JPEG output
      # luminance at each lux level.
      strength: 0.0
      # Target post-gamma normalised mean luminance [0.0-1.0].
      # 114/255 = 0.447 = mobile reference. Active when strength > 0.
      target_output: 0.447
      # Temporal smoothing [0.0-1.0]. Higher values reduce flicker.
      smoothing_factor: 0.3
      # Normalised luminance floor below which adaptive gamma update is skipped.
      dark_scene_threshold: 0.01
      # Normalised input breakpoint for bipartite linear toe (SAMA7G5 only).
      # Must be an integer multiple of 16/1023 ≈ 0.01565 to align with a LUT
      # entry boundary; misalignment produces a visible shadow step artefact.
      # 0.0313 = 32/1023 (entry-2 boundary) is the recommended value.
      toe_input: 0.0313
      # Reinhard extended white-point (tone_rolloff_start = W in y*(1+y/W^2)/(1+y)).
      # Controls where highlights start compressing:
      #   0.75 = aggressive (mobile-like, ~L=190/255 maps to ~L=168)
      #   0.85 = moderate  (outdoor default, less compression)
      #   1.0  = disabled  (pure gamma 2.2, no tone mapping)
      tone_rolloff_start: 0.75
      # Shoulder slope compression factor [0.05, 1.0].
      # The gamma derivative at rolloffStart is multiplied by this.
      # Lower values compress highlights more aggressively.
      tone_rolloff_slope: 0.35

  - Ccm:
      # Temporal smoothing factor [0-1]. Higher values give more stable
      # but slower colour transitions between illuminants.
      smoothing_factor: 0.7
      # Fallback colour temperature (K) used before AWB produces an estimate.
      ct_fallback: 5500
      # Chroma scale [0-1] for the matrices below. The CC block clamps to the
      # unsigned pixel range; at full strength it drives green negative (black)
      # on blue scenes. Blending toward identity bounds it; row sums stay unity.
      saturation: 0.6
      # Adaptive snap thresholds for CT-change-based matrix transitions.
      # When |ct_delta| > snap_threshold the matrix snaps immediately;
      # when > fast_threshold the transition speed is multiplied by fast_factor.
      ct_snap:
        snap_threshold: 1500
        fast_threshold: 500
        fast_factor: 0.5
      # These matrices are the Raspberry Pi reference-design IMX219
      # calibration (raspberrypi/libcamera vc4/data/imx219.json, rpi.ccm),
      # adopted verbatim at their measured colour temperatures. IMX219 is
      # the same sensor and the ISC CC block sits at the same pipeline
      # position as the Pi CCM stage (post-WB, pre-gamma, on linear RGB),
      # so the coefficients transfer directly. Rows sum to 1.0 (white
      # preserving) and the largest coefficient (3.08) is within the ISC
      # CC range (kCcmScale 256, max 2047 = 8.0x). They are applied at the
      # reduced chroma set by "saturation" above; a confirming Macbeth
      # capture on this board is still worthwhile to fine-tune that scale.
      matrices:
        cloudy_daylight:
          ct: 7580
          ccm: [2.21175, -0.53242, -0.67933, -0.57875, 3.07922, -1.50047, -0.27709, -0.73338, 2.01048]

        daylight:
          ct: 5858
          ccm: [2.32392, -0.88421, -0.43971, -0.63821, 2.58348, -0.94527, -0.28541, -0.54112, 1.82653]

        daylight_fluorescent:
          ct: 4650
          ccm: [2.18174, -0.70887, -0.47287, -0.70196, 2.76426, -1.06231, -0.25157, -0.71978, 1.97135]

        fluorescent:
          ct: 3603
          ccm: [2.18644, -0.66148, -0.52496, -0.77828, 2.69474, -0.91645, -0.25239, -0.83059, 2.08298]

        tungsten:
          ct: 2960
          ccm: [2.26962, -0.54174, -0.72789, -0.77008, 2.60271, -0.83262, -0.26036, -1.51254, 2.77289]

        candlelight:
          ct: 2860
          ccm: [2.12089, -0.52461, -0.59629, -0.85342, 2.80445, -0.95103, -0.26897, -1.14788, 2.41685]

# Output-path post-processing (pipeline handler, gated by IscStillProcess).
modules:
  # Output-domain contrast stretch. The IPA meters on the pre-WB histogram and
  # cannot see the final distribution; this expands a compressed output to fill
  # the range. Luma percentiles [lo, hi] map to [black_target, white_target];
  # max_gain caps the stretch so flat/noisy scenes are not blown up. One affine
  # map is applied to R, G, B alike, so it changes contrast, not white balance.
  - AutoLevels:
      enable: true
      lo_percentile: 0.01
      hi_percentile: 0.99
      # black_target low so the stretch anchors the floor to near-black and
      # removes haze. max_gain high so a compressed input still reaches
      # white_target. Authored "look", not measured.
      max_gain: 6.5
      black_target: 12
      white_target: 205
      # Histogram subsample step (1/sample^2 of pixels); percentiles stay stable.
      sample: 4
...
